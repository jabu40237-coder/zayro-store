<!DOCTYPE html>
<html lang="ar" dir="rtl" data-lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAYRO STORE — Track order</title>
<meta name="description" content="ZAYRO STORE — تتبّع الطلب · Track your order.">
<meta property="og:title" content="ZAYRO STORE — Track order">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="styles.css">
<script>
  try { var l = localStorage.getItem("zayro_lang"); if (l === "en") { document.documentElement.lang = "en"; document.documentElement.dir = "ltr"; document.documentElement.setAttribute("data-lang", "en"); } } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header id="siteHeader"></header>
<main>
  <div class="page-wrap">
    <h1 data-i18n="trTitle">تتبّع الطلب</h1>
    <form class="form-card" id="trForm" style="margin:0 0 30px">
      <label for="trId" data-i18n="okOrderId">رقم الطلب</label>
      <input id="trId" type="text" data-i18n-ph="trIdPh" placeholder="رقم الطلب (مثال ZY-2026-0001)" maxlength="20">
      <label for="trToken" data-i18n="okToken">رمز الوصول (احتفظ به سراً)</label>
      <input id="trToken" type="text" data-i18n-ph="trTokenPh" placeholder="رمز الوصول" maxlength="20">
      <button class="btn btn-solid" type="submit" style="width:100%" data-i18n="trBtn">عرض الحالة</button>
      <p class="form-msg" id="trMsg" role="status" aria-live="polite"></p>
    </form>
    <div id="trResult"></div>
  </div>
</main>
<footer id="siteFooter"></footer>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="store.js"></script>
<script src="track.js"></script>
<script src="app.js"></script>
</body>
</html>
